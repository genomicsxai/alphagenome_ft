# Example head config for `python -m alphagenome_ft.finetune --targets-config ...`:
# one RNA-seq head plus the three splice heads, trained jointly.
# Relative paths resolve against this file's directory. Replace the placeholder
# paths with your own files (junction / SSU files are produced by
# alphagenome-pytorch's `agt preprocess` tools).
heads:
  - id: rna_seq
    source: predefined
    kind: rna_seq
    resolutions: [1]          # 1 bp only, as alphagenome-pytorch
    targets:                  # nonzero_mean is estimated from the training windows
      - path: sample1.forward.bw
      - path: sample1.reverse.bw

  - id: splice_site
    source: predefined
    kind: splice_sites_classification
    star_junctions: [sample1.SJ.out.tab]
    ssu: [sample1.ssu.parquet]          # optional; omit to derive sites from junctions
    # gtf: gencode.splice_sites.parquet # optional annotated sites (zero usage)
    filter_to_junctions: false          # train on every window of the split

  - id: splice_usage
    source: predefined
    kind: splice_sites_usage
    star_junctions: [sample1.SJ.out.tab]
    ssu: [sample1.ssu.parquet]
    filter_to_junctions: false

  - id: splice_junctions
    source: predefined
    kind: splice_sites_junction
    star_junctions: [sample1.SJ.out.tab]
    ssu: [sample1.ssu.parquet]
    filter_to_junctions: false
    max_splice_sites: 256
    junction_position_source: annotated # or "predicted" (+ classification_head_id: splice_site)
